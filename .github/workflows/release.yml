# WhisperHUD Release Workflow
#
# Builds and releases WhisperHUD.app for macOS when a version tag is pushed.
#
# Triggers on:
#   - Tags matching v*.*.* (e.g., v1.0.0, v1.2.3)
#
# Creates:
#   - WhisperHUD.app bundle
#   - WhisperHUD-X.X.X.dmg installer
#   - appcast.xml for Sparkle auto-updates
#
# Usage:
#   git tag v1.0.0
#   git push origin v1.0.0

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (without v prefix)'
        required: true
        default: '1.0.0'

env:
  APP_NAME: WhisperHUD
  PYTHON_VERSION: '3.11'

jobs:
  build:
    name: Build macOS App
    runs-on: macos-14  # macOS Sonoma with Apple Silicon
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Get version from tag
        id: version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Validate version format (only allow semver)
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Invalid version format. Use X.Y.Z (e.g., 1.0.0)"
              exit 1
            fi
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install py2app
          pip install -e ".[dev]"

      - name: Generate assets
        run: |
          pip install Pillow numpy
          cd assets && python generate_assets.py --icons --svg

      - name: Verify version consistency
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Check pyproject.toml
          PYPROJECT_VERSION=$(grep -m1 'version = ' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          if [ "$PYPROJECT_VERSION" != "$VERSION" ]; then
            echo "Error: pyproject.toml version ($PYPROJECT_VERSION) != tag version ($VERSION)"
            exit 1
          fi

          # Check __init__.py
          INIT_VERSION=$(grep '__version__' whisper-hud/whisper_hud/__init__.py | sed 's/.*"\(.*\)".*/\1/')
          if [ "$INIT_VERSION" != "$VERSION" ]; then
            echo "Error: __init__.py version ($INIT_VERSION) != tag version ($VERSION)"
            exit 1
          fi

      - name: Build .app bundle
        run: |
          export PYTHONPATH="${PWD}/whisper-hud:${PYTHONPATH}"
          python setup_app.py py2app --dist-dir dist --bdist-base build

      - name: Verify app bundle
        run: |
          APP_PATH="dist/${{ env.APP_NAME }}.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App bundle not found"
            exit 1
          fi

          # Check app can launch (basic sanity check)
          echo "App bundle created successfully"
          ls -la "$APP_PATH/Contents/"

      - name: Copy assets to bundle
        run: |
          APP_PATH="dist/${{ env.APP_NAME }}.app"
          RESOURCES="$APP_PATH/Contents/Resources/assets"
          mkdir -p "$RESOURCES"
          cp -R assets/icons "$RESOURCES/"
          cp -R assets/dithered "$RESOURCES/" 2>/dev/null || true
          cp -R assets/ascii "$RESOURCES/" 2>/dev/null || true

      - name: Download Sparkle framework
        run: |
          # Download Sparkle 2.x
          SPARKLE_VERSION="2.5.2"
          SPARKLE_URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"

          mkdir -p /tmp/sparkle
          curl -L "$SPARKLE_URL" | tar -xJ -C /tmp/sparkle

          # Copy framework to app bundle
          APP_PATH="dist/${{ env.APP_NAME }}.app"
          mkdir -p "$APP_PATH/Contents/Frameworks"
          cp -R /tmp/sparkle/Sparkle.framework "$APP_PATH/Contents/Frameworks/"

          echo "Sparkle framework embedded"

      - name: Code sign app (ad-hoc)
        run: |
          APP_PATH="dist/${{ env.APP_NAME }}.app"

          # Sign embedded frameworks
          find "$APP_PATH/Contents/Frameworks" -type f -name "*.dylib" -exec codesign --force --sign - {} \; 2>/dev/null || true
          find "$APP_PATH/Contents/Frameworks" -type d -name "*.framework" -exec codesign --force --deep --sign - {} \; 2>/dev/null || true

          # Sign the main app
          codesign --force --deep --sign - \
            --options runtime \
            --entitlements entitlements.plist \
            "$APP_PATH"

          echo "App signed (ad-hoc)"

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP_PATH="dist/${{ env.APP_NAME }}.app"
          DMG_NAME="${{ env.APP_NAME }}-${VERSION}.dmg"
          DMG_PATH="dist/${DMG_NAME}"

          # Create DMG with create-dmg or hdiutil
          if command -v create-dmg &> /dev/null; then
            create-dmg \
              --volname "${{ env.APP_NAME }}" \
              --window-pos 200 120 \
              --window-size 540 380 \
              --icon-size 128 \
              --icon "${{ env.APP_NAME }}.app" 135 190 \
              --hide-extension "${{ env.APP_NAME }}.app" \
              --app-drop-link 405 190 \
              "$DMG_PATH" \
              "$APP_PATH"
          else
            # Fallback to hdiutil
            hdiutil create -srcfolder "$APP_PATH" \
              -volname "${{ env.APP_NAME }}" \
              -format UDZO \
              -imagekey zlib-level=9 \
              "$DMG_PATH"
          fi

          echo "DMG created: $DMG_PATH"
          ls -la "$DMG_PATH"

      - name: Generate appcast.xml
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG_PATH="dist/${{ env.APP_NAME }}-${VERSION}.dmg"

          python scripts/generate-appcast.py "$VERSION" "$DMG_PATH" \
            --output dist/appcast.xml \
            --min-os 12.0

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.dmg
            dist/appcast.xml
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Extract changelog
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract changelog section for this version
          if [ -f CHANGELOG.md ]; then
            # Get content between version headers (safe extraction)
            NOTES=$(awk "/^## \[${VERSION}\]/{flag=1;next}/^## \[/{flag=0}flag" CHANGELOG.md | head -50)
            if [ -n "$NOTES" ]; then
              echo "notes<<EOF" >> $GITHUB_OUTPUT
              echo "$NOTES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            else
              echo "notes=Bug fixes and improvements." >> $GITHUB_OUTPUT
            fi
          else
            echo "notes=Bug fixes and improvements." >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHANGELOG_NOTES: ${{ steps.changelog.outputs.notes }}
        with:
          name: WhisperHUD v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## WhisperHUD v${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.notes }}

            ### Installation

            1. Download `WhisperHUD-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG file
            3. Drag WhisperHUD to your Applications folder
            4. Launch WhisperHUD from Applications

            ### Requirements

            - macOS 12.0 (Monterey) or later
            - Microphone access
            - Accessibility permissions (for text insertion)

            ### Auto-Updates

            If you're upgrading from a previous version, WhisperHUD will check for updates automatically.
          files: |
            dist/*.dmg
            dist/appcast.xml

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Files uploaded:**" >> $GITHUB_STEP_SUMMARY
          ls -la dist/*.dmg dist/*.xml 2>/dev/null | while read line; do
            echo "- $line" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/$REPO/releases/tag/v$VERSION" >> $GITHUB_STEP_SUMMARY
