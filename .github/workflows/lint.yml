name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run ruff
        run: |
          ruff check .

      - name: Run mypy
        run: |
          mypy whisper-hud/whisper_hud/

      - name: Run black
        run: |
          black --check .

  syntax-check:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: |
          find whisper-hud/whisper_hud -name '*.py' -exec python -m py_compile {} +
